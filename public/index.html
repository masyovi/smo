<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMO — Save My Office</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      color: white; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center; padding: 24px;
    }
    .box { max-width: 320px; }
    .logo { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 14px;
            background: white; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
    .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { font-size: 13px; opacity: 0.85; line-height: 1.5; margin: 0 0 20px; }
    .spin { width: 28px; height: 28px; margin: 0 auto; border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo"><img src="/smo-icon.png" alt="SMO" /></div>
    <h1>SMO</h1>
    <p>Save My Office<br>Menghubungkan ke server…</p>
    <div class="spin"></div>
  </div>
</body>
</html>
